# Project metadata, used by tooling and by a source install.
#
# The supported deployment is the PyInstaller build described in
# portfoliox.spec and in "Build a Windows app" in readme.md. A pip install
# also works: when the package runs from site-packages, paths.py keeps its
# writable folders under %LOCALAPPDATA%\PortfolioX instead of writing into
# the (often read-only) install directory.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfoliox"
version = "0.1.0"
description = "Local desktop portfolio ledger for Indian equity investing"
readme = "readme.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "PortfolioX Contributors"},
]
dependencies = [
    "customtkinter==6.0.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "pypdf==6.21.3",
    "keyring==25.7.0",
    "cryptography==50.0.0",
    "yfinance==1.7.0",
]

# A console-free launcher named PortfolioX, matching the bundled build.
[project.gui-scripts]
PortfolioX = "app:main"

[tool.setuptools]
py-modules = ["app", "paths"]

[tool.setuptools.packages.find]
include = [
    "ui*",
    "books*",
    "calculations*",
    "database*",
    "importers*",
    "market_data*",
    "reports*",
    "security*",
    "tools*",
]
